name: Release

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Only run on manual dispatch OR if 'release' is in the commit message
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, 'release')
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      upload_url: ${{ steps.release.outputs.upload_url }}
      pr_created: ${{ steps.release.outputs.pr_created }}
      pr_number: ${{ steps.release.outputs.pr_number }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          # Fetch all history for proper version calculation
          fetch-depth: 0

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .release-please.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  # ============================================================================
  # Format Release PR - Build, format, and commit to PR
  # ============================================================================
  format-release-pr:
    needs: release-please
    # Only run if a PR was created by release-please
    if: ${{ needs.release-please.outputs.pr_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Resolve release PR branch
        id: release-pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          script: |
            const prNumber = Number('${{ needs.release-please.outputs.pr_number }}');
            const { data } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            core.setOutput('head_ref', data.head.ref);

      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          # Checkout the actual PR head branch so commits/pushes are deterministic
          ref: ${{ steps.release-pr.outputs.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Update Cargo.lock (deterministic sync with Cargo.toml)
        working-directory: src-tauri
        run: |
          set -euo pipefail

          ROOT_VERSION=$(awk -F '"' '/^version = "/ { print $2; exit }' Cargo.toml)
          if [ -z "$ROOT_VERSION" ]; then
            echo "Failed to parse package version from Cargo.toml"
            exit 1
          fi

          cargo update -p copilot-tracker

          LOCK_VERSION=$(awk '
            $0 == "name = \"copilot-tracker\"" {
              getline
              if ($0 ~ /^version = "/) {
                gsub(/^version = "|"$/, "", $0)
                print $0
                exit
              }
            }
          ' Cargo.lock)

          if [ "$LOCK_VERSION" != "$ROOT_VERSION" ]; then
            echo "cargo update did not refresh root package version; applying targeted lock sync"
            sed -i.bak '/^name = "copilot-tracker"$/ { n; s/^version = ".*"$/version = "'"$ROOT_VERSION"'"/; }' Cargo.lock
            rm -f Cargo.lock.bak
            LOCK_VERSION=$(awk '
              $0 == "name = \"copilot-tracker\"" {
                getline
                if ($0 ~ /^version = "/) {
                  gsub(/^version = "|"$/, "", $0)
                  print $0
                  exit
                }
              }
            ' Cargo.lock)
          fi

          if [ "$LOCK_VERSION" != "$ROOT_VERSION" ]; then
            echo "Cargo.lock root package version mismatch after sync"
            echo "Cargo.toml: $ROOT_VERSION"
            echo "Cargo.lock: ${LOCK_VERSION:-<missing>}"
            exit 1
          fi

          # Validate lockfile parses in locked mode without triggering dependency drift.
          cargo metadata --locked --format-version=1 > /dev/null

      - name: Build frontend assets
        run: npm run build:web

      - name: Run formatting (after build)
        run: npm run format

      - name: Update contributors
        id: contributors
        run: |
          # Get current tag (the one we're releasing FROM - previous release)
          CURRENT_TAG=$(git describe --tags --abbrev=0)

          if [ -z "$CURRENT_TAG" ]; then
            echo "No previous tag found, skipping contributor update"
            echo "has_contributors=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Previous release tag: $CURRENT_TAG"

          # Get unique contributor identity rows since current tag
          CONTRIBUTORS=$(git log "${CURRENT_TAG}..HEAD" --format='%an|%ae' | sort -u || true)

          if [ -z "$CONTRIBUTORS" ]; then
            echo "No new contributors found"
            echo "has_contributors=false" >> $GITHUB_OUTPUT
          else
            echo "Found new contributors:"
            echo "$CONTRIBUTORS"
            echo "has_contributors=true" >> $GITHUB_OUTPUT
            
            # Install all-contributors CLI
            npm install -g all-contributors-cli

            # Keep track of usernames already added in this run
            ADDED_USERNAMES=""
            
            # Process each contributor
            while IFS= read -r line; do
              [ -z "$line" ] && continue

              USERNAME=$(echo "$line" | cut -d'|' -f1)
              EMAIL=$(echo "$line" | cut -d'|' -f2)

              # Skip owner and bot identities
              if echo "$USERNAME|$EMAIL" | grep -Eqi 'bizzkoot|github-actions\[bot\]'; then
                continue
              fi

              GH_USERNAME=""

              # 1) Most reliable: derive username from GitHub noreply email
              if echo "$EMAIL" | grep -Eq '^[0-9]+\+[^@]+@users\.noreply\.github\.com$'; then
                GH_USERNAME=$(echo "$EMAIL" | sed -E 's/^[0-9]+\+([^@]+)@users\.noreply\.github\.com$/\1/')
              elif echo "$EMAIL" | grep -Eq '^[^@]+@users\.noreply\.github\.com$'; then
                GH_USERNAME=$(echo "$EMAIL" | sed -E 's/^([^@]+)@users\.noreply\.github\.com$/\1/')
              fi

              # 2) Fallback: search GitHub user by email (may fail for private emails)
              if [ -z "$GH_USERNAME" ] && [ -n "$EMAIL" ]; then
                GH_USERNAME=$(curl -s \
                  -H "Authorization: Bearer ${{ secrets.RELEASE_PLEASE_TOKEN }}" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/search/users?q=${EMAIL}+in:email" | \
                  jq -r '.items[0].login // empty')
              fi

              # 3) Final fallback: treat author name as GitHub username if it exists
              if [ -z "$GH_USERNAME" ] && [ -n "$USERNAME" ]; then
                if curl -s -f \
                  -H "Authorization: Bearer ${{ secrets.RELEASE_PLEASE_TOKEN }}" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/users/${USERNAME}" >/dev/null; then
                  GH_USERNAME="$USERNAME"
                fi
              fi

              if [ -z "$GH_USERNAME" ]; then
                echo "Could not resolve GitHub username for $USERNAME ($EMAIL), skipping"
                continue
              fi

              # Prevent duplicate add calls in same run
              if echo "$ADDED_USERNAMES" | grep -Eq "(^| )${GH_USERNAME}( |$)"; then
                continue
              fi

              echo "Adding contributor: $GH_USERNAME"
              all-contributors add "$GH_USERNAME" code --yes
              ADDED_USERNAMES="$ADDED_USERNAMES $GH_USERNAME"
            done <<< "$CONTRIBUTORS"

            # Normalize contributor profile links to GitHub profiles
            if [ -f ".all-contributorsrc" ]; then
              TMP_CONFIG=$(mktemp)
              jq '.contributors |= map(if (.login // "") != "" then .profile = ("https://github.com/" + .login) else . end)' \
                .all-contributorsrc > "$TMP_CONFIG"
              mv "$TMP_CONFIG" .all-contributorsrc
              all-contributors generate --yes
            fi
          fi

      - name: Commit all changes (build + format + contributors)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff --staged --quiet || git commit -m "style: apply formatting and update contributors"
          git push origin "HEAD:${{ steps.release-pr.outputs.head_ref }}"

  # ============================================================================
  # Validate Release PR - Comprehensive checks before merge
  # ============================================================================
  validate-release-pr:
    needs: [release-please, format-release-pr]
    # Only run if formatting was successful
    if: ${{ needs.format-release-pr.result == 'success' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          # Checkout the PR branch
          ref: refs/pull/${{ needs.release-please.outputs.pr_number }}/head
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust (non-Windows)
        if: runner.os != 'Windows'
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust (Windows)
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type checking
        run: npm run typecheck

      - name: Verify version sync
        run: |
          EXPECTED_VERSION=$(jq -r '.version' package.json)
          echo "=== Version Verification ==="
          echo "Expected version: $EXPECTED_VERSION"
          echo ""

          # Check all version files match package.json
          PKG_VERSION=$(jq -r '.version' package.json)
          TAURI_CONF_VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          CARGO_VERSION=$(grep '^version = ' src-tauri/Cargo.toml | head -1 | sed 's/version = "\([^"]*\)".*/\1/')

          echo "✓ package.json: $PKG_VERSION"
          echo "✓ tauri.conf.json: $TAURI_CONF_VERSION"
          echo "✓ Cargo.toml: $CARGO_VERSION"
          echo ""

          FAILED=false

          if [ "$PKG_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "❌ FAILED: package.json version mismatch"
            FAILED=true
          fi

          if [ "$TAURI_CONF_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "❌ FAILED: tauri.conf.json version mismatch"
            FAILED=true
          fi

          if [ "$CARGO_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "❌ FAILED: Cargo.toml version mismatch"
            FAILED=true
          fi

          if [ "$FAILED" = true ]; then
            echo ""
            echo "🛑 Version sync verification FAILED!"
            exit 1
          fi

          echo "✅ All versions verified successfully!"

      - name: Run ESLint
        run: npm run lint
        continue-on-error: false

      - name: Dry run build - Frontend
        run: npm run build

      - name: Dry run build - Rust compilation check
        run: |
          cd src-tauri
          cargo check --all-targets --all-features

      - name: Report validation status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ All validation checks passed on ${{ matrix.os }}"
          else
            echo "❌ Validation failed on ${{ matrix.os }}"
            exit 1
          fi

  # ============================================================================
  # Post Validation Summary to PR
  # ============================================================================
  post-validation-summary:
    needs: [release-please, validate-release-pr]
    # Run after validation, regardless of result
    if: always() && needs.release-please.outputs.pr_created
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Generate validation summary
        id: summary
        run: |
          if [ "${{ needs.validate-release-pr.result }}" == "success" ]; then
            echo "summary=✅ **All validation checks passed!**" >> $GITHUB_OUTPUT
            echo "details=<br><br>### Validation Results<br>✅ TypeScript type checking<br>✅ ESLint<br>✅ Version sync<br>✅ Frontend build<br>✅ Rust compilation (all platforms)" >> $GITHUB_OUTPUT
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "summary=❌ **Validation checks failed**" >> $GITHUB_OUTPUT
            echo "details=<br><br>### Validation Results<br>⚠️ Some validation checks failed. Please check the workflow logs for details.<br><br>**Failed checks may include:**<br>- TypeScript type errors<br>- ESLint violations<br>- Version sync issues<br>- Build failures<br>- Rust compilation errors" >> $GITHUB_OUTPUT
            echo "status=failure" >> $GITHUB_OUTPUT
          fi

      - name: Find comment
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ needs.release-please.outputs.pr_number }}
          comment-author: "github-actions[bot]"
          body-includes: "<!-- validation-summary -->"

      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ needs.release-please.outputs.pr_number }}
          edit-mode: replace
          body: |
            <!-- validation-summary -->
            ## Release PR Validation ${{ steps.summary.outputs.summary }}

            ${{ steps.summary.outputs.details }}

            <details>
            <summary>View detailed workflow logs</summary>

            - [TypeScript](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - [ESLint](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - [Build](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

            </details>

            ---
            *This comment is automatically updated by the validation workflow.*

      - name: Fail workflow if validation failed
        if: steps.summary.outputs.status == 'failure'
        run: exit 1

  # ============================================================================
  # Verify version sync (for release publishing)
  # ============================================================================
  verify-versions:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    outputs:
      verified: ${{ steps.verify.outputs.verified }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Verify version sync
        id: verify
        run: |
          EXPECTED_VERSION=${{ needs.release-please.outputs.tag_name }}
          EXPECTED_VERSION=${EXPECTED_VERSION#v}

          echo "=== Version Verification Report ==="
          echo "Expected version: $EXPECTED_VERSION"
          echo ""

          # Check package.json
          PKG_VERSION=$(jq -r '.version' package.json)
          echo "✓ package.json: $PKG_VERSION"

          # Check tauri.conf.json
          TAURI_CONF_VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          echo "✓ tauri.conf.json: $TAURI_CONF_VERSION"

          # Check Cargo.toml
          CARGO_VERSION=$(grep '^version = ' src-tauri/Cargo.toml | head -1 | sed 's/version = "\([^"]*\)".*/\1/')
          echo "✓ Cargo.toml: $CARGO_VERSION"
          echo ""

          # Verification
          FAILED=false

          if [ "$PKG_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "❌ FAILED: package.json version mismatch (expected: $EXPECTED_VERSION, got: $PKG_VERSION)"
            FAILED=true
          fi

          if [ "$TAURI_CONF_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "❌ FAILED: tauri.conf.json version mismatch (expected: $EXPECTED_VERSION, got: $TAURI_CONF_VERSION)"
            FAILED=true
          fi

          if [ "$CARGO_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "❌ FAILED: Cargo.toml version mismatch (expected: $EXPECTED_VERSION, got: $CARGO_VERSION)"
            FAILED=true
          fi

          # Cargo.lock check (informational only - will be auto-updated during build)
          CARGO_LOCK_VERSION=$(grep -A 2 'name = "copilot-tracker"' src-tauri/Cargo.lock | grep '^version = ' | head -1 | sed 's/version = "\([^"]*\)".*/\1/')
          if [ "$CARGO_LOCK_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "⚠️  Cargo.lock: $CARGO_LOCK_VERSION (will be auto-updated during build)"
          else
            echo "✓ Cargo.lock: $CARGO_LOCK_VERSION"
          fi

          if [ "$FAILED" = true ]; then
            echo ""
            echo "🛑 Version sync verification FAILED!"
            echo "Please check the sync script and try again."
            exit 1
          fi

          echo ""
          echo "✅ All critical versions verified successfully!"
          echo "verified=true" >> $GITHUB_OUTPUT

  # ============================================================================
  # Tauri Builds (All Platforms - Unsigned)
  # ============================================================================
  build-tauri:
    needs: [release-please, verify-versions]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        include:
          - os: macos-latest
            target: universal-apple-darwin
            rust_target: aarch64-apple-darwin,x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rust_target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_target: x86_64-pc-windows-msvc

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust (macOS/Linux)
        if: runner.os != 'Windows'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Rust (Windows)
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install System Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          # Note: Rust targets are already installed by dtolnay/rust-toolchain action above
          # No need to manually add targets here

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Tauri App (macOS)
        if: runner.os == 'macOS'
        run: |
          # Build universal macOS binary (Apple Silicon + Intel)
          npm run build:web && npx tauri build --target universal-apple-darwin
        env:
          TAURI_BUNDLE_SKIP_SIGNING: "true"

      - name: Build Tauri App (Linux)
        if: runner.os == 'Linux'
        run: |
          npm run build:web && npx tauri build --target x86_64-unknown-linux-gnu
        env:
          TAURI_BUNDLE_SKIP_SIGNING: "true"

      - name: Build Tauri App (Windows)
        if: runner.os == 'Windows'
        run: |
          npm run build:web && npx tauri build --target x86_64-pc-windows-msvc
        env:
          TAURI_BUNDLE_SKIP_SIGNING: "true"

      - name: Upload Tauri Release Assets (macOS)
        if: runner.os == 'macOS'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
          tag_name: ${{ needs.release-please.outputs.tag_name }}

      - name: Upload Tauri Release Assets (Linux)
        if: runner.os == 'Linux'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          tag_name: ${{ needs.release-please.outputs.tag_name }}

      - name: Upload Tauri Release Assets (Windows)
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          tag_name: ${{ needs.release-please.outputs.tag_name }}
