name: Release

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Only run on manual dispatch OR if 'release' is in the commit message
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, 'release')
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      upload_url: ${{ steps.release.outputs.upload_url }}
      pr_created: ${{ steps.release.outputs.pr_created }}
      pr_number: ${{ steps.release.outputs.pr_number }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          # Fetch all history for proper version calculation
          fetch-depth: 0

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .release-please.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  # ============================================================================
  # Format Release PR - Build, format, and commit to PR
  # ============================================================================
  format-release-pr:
    needs: release-please
    # Only run if a PR was created by release-please
    if: ${{ needs.release-please.outputs.pr_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          # Checkout the PR branch directly (not merge commit)
          ref: refs/pull/${{ needs.release-please.outputs.pr_number }}/head
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build project (updates lock files)
        run: npm run build

      - name: Run formatting (after build)
        run: npm run format

      - name: Commit all changes (build + format)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff --staged --quiet || git commit -m "style: apply formatting after version update and build"
          git push

  # ============================================================================
  # Validate Release PR - Comprehensive checks before merge
  # ============================================================================
  validate-release-pr:
    needs: [release-please, format-release-pr]
    # Only run if formatting was successful
    if: ${{ needs.format-release-pr.result == 'success' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          # Checkout the PR branch
          ref: refs/pull/${{ needs.release-please.outputs.pr_number }}/head
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust (non-Windows)
        if: runner.os != 'Windows'
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust (Windows)
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type checking
        run: npm run typecheck

      - name: Verify version sync
        run: |
          EXPECTED_VERSION=$(jq -r '.version' package.json)
          echo "=== Version Verification ==="
          echo "Expected version: $EXPECTED_VERSION"
          echo ""

          # Check all version files match package.json
          PKG_VERSION=$(jq -r '.version' package.json)
          TAURI_CONF_VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          CARGO_VERSION=$(grep '^version = ' src-tauri/Cargo.toml | head -1 | sed 's/version = "\([^"]*\)".*/\1/')

          echo "✓ package.json: $PKG_VERSION"
          echo "✓ tauri.conf.json: $TAURI_CONF_VERSION"
          echo "✓ Cargo.toml: $CARGO_VERSION"
          echo ""

          FAILED=false

          if [ "$PKG_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "❌ FAILED: package.json version mismatch"
            FAILED=true
          fi

          if [ "$TAURI_CONF_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "❌ FAILED: tauri.conf.json version mismatch"
            FAILED=true
          fi

          if [ "$CARGO_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "❌ FAILED: Cargo.toml version mismatch"
            FAILED=true
          fi

          if [ "$FAILED" = true ]; then
            echo ""
            echo "🛑 Version sync verification FAILED!"
            exit 1
          fi

          echo "✅ All versions verified successfully!"

      - name: Run ESLint
        run: npm run lint
        continue-on-error: false

      - name: Dry run build - Frontend
        run: npm run build

      - name: Dry run build - Rust compilation check
        run: |
          cd src-tauri
          cargo check --all-targets --all-features

      - name: Report validation status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ All validation checks passed on ${{ matrix.os }}"
          else
            echo "❌ Validation failed on ${{ matrix.os }}"
            exit 1
          fi

  # ============================================================================
  # Post Validation Summary to PR
  # ============================================================================
  post-validation-summary:
    needs: [release-please, validate-release-pr]
    # Run after validation, regardless of result
    if: always() && needs.release-please.outputs.pr_created
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Generate validation summary
        id: summary
        run: |
          if [ "${{ needs.validate-release-pr.result }}" == "success" ]; then
            echo "summary=✅ **All validation checks passed!**" >> $GITHUB_OUTPUT
            echo "details=<br><br>### Validation Results<br>✅ TypeScript type checking<br>✅ ESLint<br>✅ Version sync<br>✅ Frontend build<br>✅ Rust compilation (all platforms)" >> $GITHUB_OUTPUT
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "summary=❌ **Validation checks failed**" >> $GITHUB_OUTPUT
            echo "details=<br><br>### Validation Results<br>⚠️ Some validation checks failed. Please check the workflow logs for details.<br><br>**Failed checks may include:**<br>- TypeScript type errors<br>- ESLint violations<br>- Version sync issues<br>- Build failures<br>- Rust compilation errors" >> $GITHUB_OUTPUT
            echo "status=failure" >> $GITHUB_OUTPUT
          fi

      - name: Find comment
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ needs.release-please.outputs.pr_number }}
          comment-author: "github-actions[bot]"
          body-includes: "<!-- validation-summary -->"

      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ needs.release-please.outputs.pr_number }}
          edit-mode: replace
          body: |
            <!-- validation-summary -->
            ## Release PR Validation ${{ steps.summary.outputs.summary }}

            ${{ steps.summary.outputs.details }}

            <details>
            <summary>View detailed workflow logs</summary>

            - [TypeScript](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - [ESLint](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - [Build](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

            </details>

            ---
            *This comment is automatically updated by the validation workflow.*

      - name: Fail workflow if validation failed
        if: steps.summary.outputs.status == 'failure'
        run: exit 1

  # ============================================================================
  # Verify version sync (for release publishing)
  # ============================================================================
  verify-versions:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    outputs:
      verified: ${{ steps.verify.outputs.verified }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Verify version sync
        id: verify
        run: |
          EXPECTED_VERSION=${{ needs.release-please.outputs.tag_name }}
          EXPECTED_VERSION=${EXPECTED_VERSION#v}

          echo "=== Version Verification Report ==="
          echo "Expected version: $EXPECTED_VERSION"
          echo ""

          # Check package.json
          PKG_VERSION=$(jq -r '.version' package.json)
          echo "✓ package.json: $PKG_VERSION"

          # Check tauri.conf.json
          TAURI_CONF_VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          echo "✓ tauri.conf.json: $TAURI_CONF_VERSION"

          # Check Cargo.toml
          CARGO_VERSION=$(grep '^version = ' src-tauri/Cargo.toml | head -1 | sed 's/version = "\([^"]*\)".*/\1/')
          echo "✓ Cargo.toml: $CARGO_VERSION"
          echo ""

          # Verification
          FAILED=false

          if [ "$PKG_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "❌ FAILED: package.json version mismatch (expected: $EXPECTED_VERSION, got: $PKG_VERSION)"
            FAILED=true
          fi

          if [ "$TAURI_CONF_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "❌ FAILED: tauri.conf.json version mismatch (expected: $EXPECTED_VERSION, got: $TAURI_CONF_VERSION)"
            FAILED=true
          fi

          if [ "$CARGO_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "❌ FAILED: Cargo.toml version mismatch (expected: $EXPECTED_VERSION, got: $CARGO_VERSION)"
            FAILED=true
          fi

          # Cargo.lock check (informational only - will be auto-updated during build)
          CARGO_LOCK_VERSION=$(grep -A 2 'name = "copilot-tracker"' src-tauri/Cargo.lock | grep '^version = ' | head -1 | sed 's/version = "\([^"]*\)".*/\1/')
          if [ "$CARGO_LOCK_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "⚠️  Cargo.lock: $CARGO_LOCK_VERSION (will be auto-updated during build)"
          else
            echo "✓ Cargo.lock: $CARGO_LOCK_VERSION"
          fi

          if [ "$FAILED" = true ]; then
            echo ""
            echo "🛑 Version sync verification FAILED!"
            echo "Please check the sync script and try again."
            exit 1
          fi

          echo ""
          echo "✅ All critical versions verified successfully!"
          echo "verified=true" >> $GITHUB_OUTPUT

  # ============================================================================
  # Tauri Builds (All Platforms - Unsigned)
  # ============================================================================
  build-tauri:
    needs: [release-please, verify-versions]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        include:
          - os: macos-latest
            target: universal-apple-darwin
            rust_target: aarch64-apple-darwin,x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rust_target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_target: x86_64-pc-windows-msvc

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust (macOS/Linux)
        if: runner.os != 'Windows'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Rust (Windows)
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install System Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          # Note: Rust targets are already installed by dtolnay/rust-toolchain action above
          # No need to manually add targets here

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Tauri App (macOS)
        if: runner.os == 'macOS'
        run: |
          # Build universal macOS binary (Apple Silicon + Intel)
          npm run build:web && npx tauri build --target universal-apple-darwin
        env:
          TAURI_BUNDLE_SKIP_SIGNING: "true"

      - name: Build Tauri App (Linux)
        if: runner.os == 'Linux'
        run: |
          npm run build:web && npx tauri build --target x86_64-unknown-linux-gnu
        env:
          TAURI_BUNDLE_SKIP_SIGNING: "true"

      - name: Build Tauri App (Windows)
        if: runner.os == 'Windows'
        run: |
          npm run build:web && npx tauri build --target x86_64-pc-windows-msvc
        env:
          TAURI_BUNDLE_SKIP_SIGNING: "true"

      - name: Upload Tauri Release Assets (macOS)
        if: runner.os == 'macOS'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
          tag_name: ${{ needs.release-please.outputs.tag_name }}

      - name: Upload Tauri Release Assets (Linux)
        if: runner.os == 'Linux'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          tag_name: ${{ needs.release-please.outputs.tag_name }}

      - name: Upload Tauri Release Assets (Windows)
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          tag_name: ${{ needs.release-please.outputs.tag_name }}

  # ============================================================================
  # Auto-add contributors (non-bizzkoot, non-bot) to All Contributors
  # ============================================================================
  update-contributors:
    runs-on: ubuntu-latest
    # Run only on release PR merge (when commit message contains 'release')
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'release')
    permissions:
      contents: write
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get last all-contributors commit
        id: last-commit
        run: |
          # Find the last commit that modified .all-contributorsrc
          LAST_CONTRIBUTOR_COMMIT=$(git log --format=%H --reverse -- .all-contributorsrc | tail -1)
          if [ -z "$LAST_CONTRIBUTOR_COMMIT" ]; then
            # If no commits found, use first commit
            LAST_CONTRIBUTOR_COMMIT=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "Last contributor update: $LAST_CONTRIBUTOR_COMMIT"
          echo "commit=$LAST_CONTRIBUTOR_COMMIT" >> $GITHUB_OUTPUT

      - name: Get unique contributors since last update
        id: contributors
        run: |
          # Exclude bizzkoot and github-actions[bot]
          EXCLUDE_AUTHOR="bizzkoot"
          EXCLUDE_EMAIL="github-actions[bot]@users.noreply.github.com"

          # Get unique authors from commits since last update
          CONTRIBUTORS=$(git log ${{ steps.last-commit.outputs.commit }}..HEAD --format='%an|%ae' | sort -u | grep -v "$EXCLUDE_AUTHOR" | grep -v "$EXCLUDE_EMAIL" || true)

          if [ -z "$CONTRIBUTORS" ]; then
            echo "No new contributors found"
            echo "new_contributors=" >> $GITHUB_OUTPUT
          else
            echo "Found new contributors:"
            echo "$CONTRIBUTORS"
            
            # Convert to JSON array for GitHub output
            JSON_ARRAY=$(echo "$CONTRIBUTORS" | jq -R . | jq -s .)
            echo "new_contributors=$JSON_ARRAY" >> $GITHUB_OUTPUT
          fi

      - name: Install Node.js
        if: steps.contributors.outputs.new_contributors != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install all-contributors CLI
        if: steps.contributors.outputs.new_contributors != ''
        run: npm install -g all-contributors-cli

      - name: Add new contributors
        if: steps.contributors.outputs.new_contributors != ''
        run: |
          # Parse each contributor and add them
          for contributor in $(echo '${{ steps.contributors.outputs.new_contributors }}' | jq -r '.[]'); do
            USERNAME=$(echo "$contributor" | cut -d'|' -f1)
            EMAIL=$(echo "$contributor" | cut -d'|' -f2)
            
            # Try to get GitHub username from email
            GH_USERNAME=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/search/users?q=$EMAIL+in:email" | \
              jq -r '.items[0].login // empty')
            
            if [ -n "$GH_USERNAME" ]; then
              echo "Adding contributor: $GH_USERNAME"
              all-contributors add "$GH_USERNAME" code
            else
              echo "Could not find GitHub username for $USERNAME ($EMAIL), skipping"
            fi
          done

      - name: Commit and push changes
        if: steps.contributors.outputs.new_contributors != ''
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Check if there are changes to commit
          if git diff --quiet .all-contributorsrc; then
            echo "No contributor changes to commit"
          else
            git add .all-contributorsrc
            git commit -m "docs: update all-contributors"
            git push
            echo "Contributors updated!"
          fi
