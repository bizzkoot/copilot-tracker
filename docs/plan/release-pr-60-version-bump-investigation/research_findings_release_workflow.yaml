patterns_found:
  - category: architecture
    pattern: Manual input is converted locally before being handed to release-please
    description: The workflow separates version parsing from release-please invocation and expects release-please to honor the parsed exact value.
    examples:
      - file: /Users/muhammadfaiz/Custom APP/copilot-tracker/.github/workflows/release.yml
        location: .github/workflows/release.yml:40
        snippet: ".github/scripts/parse_version.sh \"${{ inputs.version }}\" \"${{ steps.current-version.outputs.version }}\""
      - file: /Users/muhammadfaiz/Custom APP/copilot-tracker/.github/workflows/release.yml
        location: .github/workflows/release.yml:79
        snippet: "release-as: ${{ steps.parse-version.outputs.version }}"
    prevalence: common
  - category: architecture
    pattern: Release PR output still reflects conventional-commit semantics
    description: PR #60 produced a minor release and feature-heavy changelog exactly as release-please would do without a manual exact-version override.
    examples:
      - file: PR #60 metadata
        location: PR metadata:1
        snippet: "title: chore(main): release 2.5.0"
      - file: PR #60 metadata
        location: PR metadata:1
        snippet: "### Features\n* add backup and restore functionality in settings"
    prevalence: occasional
  - category: structure
    pattern: Previous workflow revisions tried to constrain release-please's release boundary dynamically
    description: Repo history contains local release workflow iterations that added bootstrap-sha and last-release-sha specifically to respect exact release-as behavior.
    examples:
      - file: git history
        location: reflog/local history
        snippet: "fix(release): use dynamic last-release-sha to respect exact release-as version"
      - file: git diff 1889e0a^
        location: release.yml diff
        snippet: "removed Resolve bootstrap SHA and Generate release-please config steps"
    prevalence: occasional

