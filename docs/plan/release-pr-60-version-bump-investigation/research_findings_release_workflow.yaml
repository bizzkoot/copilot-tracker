plan_id: release-pr-60-version-bump-investigation
objective: Investigate why release PR #60 bumped from 2.4.7 to 2.5.0 when the manual workflow input was 0.0.1 and the local parser resolves that to 2.4.8.
focus_area: release_workflow
created_at: 2026-04-09T00:00:00Z
created_by: GitHub Copilot
status: completed

tldr: |
  - Main branch was at version 2.4.7 in package.json and .release-please-manifest.json immediately before PR #60.
  - The current manual workflow parses input 0.0.1 to 2.4.8 and passes that value to release-please via release-as.
  - PR #60 was generated as 2.5.0 and its changelog contains feat commits, which matches normal conventional-commit minor bumping, not the requested manual patch bump.
  - Upstream release-please code and tests show release-as should win exactly over conventional-commit bumping in manifest mode.
  - Repo history shows a regression window: an earlier workflow variant tried to control release boundaries dynamically, then commit 1889e0a removed that path because release-please cannot read a job-generated config file from the runner filesystem.

