gaps:
  - area: GitHub Actions run logs
    description: The investigation could not inspect the specific workflow run logs or workflow-dispatch inputs attached to PR #60.
    impact: Prevents proving exactly why release-as failed to take effect in that run; the conclusion about root cause is therefore probabilistic rather than absolute.
  - area: PR creation event timeline from GitHub UI
    description: PR metadata available here shows the generated PR content but not the full event timeline or selected branch for the manual dispatch.
    impact: Leaves a small uncertainty between "override never reached release-please" and "the run executed a different committed workflow revision than expected."